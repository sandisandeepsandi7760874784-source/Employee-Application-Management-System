<!DOCTYPE html>
<html>
<head>
    <title>Leave Applications</title>
</head>

<body>

<h1>Previous Leave Applications</h1>

<table border="1">

<tr>
    <th>Name</th>
    <th>Leave Type</th>
    <th>Start</th>
    <th>End</th>
    <th>Days</th>
    <th>Reason</th>
    <th>Status</th>
</tr>

{% for leave in data %}

<tr>
    <td>{{ leave[1] }}</td>
    <td>{{ leave[2] }}</td>
    <td>{{ leave[3] }}</td>
    <td>{{ leave[4] }}</td>
    <td>{{ leave[5] }}</td>
    <td>{{ leave[6] }}</td>
    <td>{{ leave[7] }}</td>
</tr>

{% endfor %}

</table>

<br>

<a href="/">Apply New Leave</a>

<br><br>

<a href="/manager">Manager Dashboard</a>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Employee Leave Application</title>
</head>

<body>

<h1>Employee Leave Application</h1>

<form action="/apply" method="POST">

    Employee Name:
    <input type="text" name="name" required>
    <br><br>

    Leave Type:
    <select name="leave_type">
        <option>Casual Leave</option>
        <option>Sick Leave</option>
        <option>Earned Leave</option>
    </select>
    <br><br>

    Start Date:
    <input type="date" id="start" name="start" required>
    <br><br>

    End Date:
    <input type="date" id="end" name="end" required>
    <br><br>

    Leave Days:
    <input type="number" id="days" name="days" readonly>
    <br><br>

    Reason:
    <textarea name="reason" required></textarea>
    <br><br>

    <button type="submit">Apply Leave</button>

</form>

<br>

<a href="/applications">View Previous Applications</a>

<br><br>

<a href="/manager">Manager Dashboard</a>

<script>
function calculateDays() {

    let start = new Date(document.getElementById("start").value);
    let end = new Date(document.getElementById("end").value);

    if (end >= start) {
        let days = (end - start) / (1000 * 60 * 60 * 24) + 1;
        document.getElementById("days").value = days;
    }
}

document.getElementById("start").onchange = calculateDays;
document.getElementById("end").onchange = calculateDays;
</script>

</body>
</html>
